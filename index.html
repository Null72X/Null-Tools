<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NULL TOOLS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="logo-badge">
                <span class="logo-badge-dot"></span>
                Null Tools
            </div>
            <h1>NULL TOOLS</h1>
            <p class="subtitle">Transform bytes across C#, C++, and Python &mdash; plus external bone offsets</p>
        </header>

        <!-- TABS -->
        <nav class="tabs" id="tabContainer" aria-label="Tool Tabs">
            <button class="tab-btn active" data-tab="aob">
                <span class="tab-icon">⚡</span> AOB Converter
            </button>
            <button class="tab-btn" data-tab="bones">
                <span class="tab-icon">🦴</span> External Bones Finder
            </button>
        </nav>

        <!-- ─── TAB 1: AOB CONVERTER ─── -->
        <section class="tab-panel active" id="panel-aob">
            <div class="card" id="mainCard">
                <div class="card-content">
                    <div class="app-meta">
                        <div class="app-icon">&lt;/&gt;</div>
                        <div class="app-text">
                            <h3>Byte Forge</h3>
                            <div class="version-row">
                                <span class="version-badge" id="conversionLabel">C# → C++</span>
                                <span class="file-size">live conversion</span>
                            </div>
                        </div>
                    </div>

                    <!-- TOOLBAR -->
                    <div class="toolbar">
                        <div class="search-wrap">
                            <select id="conversionType" class="search-input" style="padding-left:16px;">
                                <option value="cs-cpp">C# → C++</option>
                                <option value="cs-py">C# → Python</option>
                                <option value="cpp-cs">C++ → C#</option>
                                <option value="cpp-py">C++ → Python</option>
                                <option value="py-cs">Python → C#</option>
                                <option value="py-cpp">Python → C++</option>
                            </select>
                        </div>
                        <div class="stats" id="statsBox"><b id="byteCountDisplay">0</b> bytes</div>
                    </div>

                    <!-- Input -->
                    <input type="text" id="aobInput" class="aob-input" placeholder="Paste AOB bytes (e.g. 90 90 ?? AB)…" autocomplete="off" />
                    
                    <!-- Output -->
                    <div id="aobOutput" class="aob-output"></div>

                    <!-- Actions -->
                    <div class="action-row">
                        <button id="copyBtn" class="btn btn-copy" type="button">
                            <span>Copy</span>
                            <svg viewBox="0 0 24 24"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </button>
                        <button id="deleteBtn" class="btn btn-delete" type="button">
                            <span>Delete</span>
                            <svg viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ─── TAB 2: EXTERNAL BONES FINDER ─── -->
        <section class="tab-panel" id="panel-bones">
            <div class="card">
                <div class="card-content">
                    <div class="app-meta">
                        <div class="app-icon">🦴</div>
                        <div class="app-text">
                            <h3>External Bones Finder</h3>
                            <div class="version-row">
                                <span class="version-badge">chest → 6 bones</span>
                                <span class="file-size">instant offsets</span>
                            </div>
                        </div>
                    </div>

                    <div class="bones-input-row">
                        <input type="text" id="chestOffsetInput" class="aob-input" placeholder="Chest offset (e.g. 0xA6)" autocomplete="off" />
                        <button id="calcBonesBtn" class="btn-calc" type="button">Calculate Bone Offsets</button>
                    </div>

                    <div class="bones-results" id="bonesResults">
                        <div class="bones-empty" id="bonesEmpty"><span>Enter a chest offset and click calculate.</span></div>
                        <table class="bones-table" id="bonesTable" style="display:none;">
                            <thead>
                                <tr>
                                    <th>Bone</th>
                                    <th>Offset</th>
                                </tr>
                            </thead>
                            <tbody id="bonesBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="footer-mark">&copy; 2026 NULL&trade; ALL RIGHTS RESERVED</footer>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="download-status" id="downloadStatus">
        <span>⚡</span>
        <span id="statusMessage">Ready</span>
    </div>

    <!-- SCRIPTS -->
    <script src="js/script.js"></script>
</body>
</html>
