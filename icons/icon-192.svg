<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14141d"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(239, 68, 68, 0.25)" stroke-width="4"/>

  <!-- Glowing Accent Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(239, 68, 68, 0.12)" stroke-width="32" filter="url(#glow)"/>

  <!-- Centered Crossed Tools Icon -->
  <g id="tools-icon">
    <!-- Wrench (Angled 45 deg) -->
    <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
      <!-- Wrench Handle -->
      <rect x="238" y="145" width="36" height="230" rx="14" fill="url(#metalGrad)" />
      <rect x="246" y="175" width="20" height="170" rx="8" fill="url(#redGlow)" />

      <!-- Wrench Open-End Head -->
      <path d="M 216 155 C 210 120 232 96 256 96 C 280 96 302 120 296 155 L 276 145 C 267 135 245 135 236 145 Z" fill="url(#metalGrad)" />

      <!-- Wrench Ring Bottom -->
      <circle cx="256" cy="385" r="28" fill="url(#metalGrad)" />
      <circle cx="256" cy="385" r="15" fill="#070709" />
    </g>

    <!-- Screwdriver (Angled -45 deg) -->
    <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
      <!-- Metal Shaft & Tip -->
      <rect x="247" y="115" width="18" height="165" rx="8" fill="url(#metalGrad)" />
      <path d="M 244 116 L 256 95 L 268 116 Z" fill="#f8fafc" />

      <!-- Cyber Ergonomic Handle -->
      <rect x="234" y="270" width="44" height="125" rx="20" fill="url(#redGlow)" filter="url(#glow)" />
      <rect x="240" y="278" width="32" height="109" rx="14" fill="#121218" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
      <line x1="244" y1="305" x2="268" y2="305" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
      <line x1="244" y1="332" x2="268" y2="332" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
      <line x1="244" y1="359" x2="268" y2="359" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Center Glowing Hex Joint -->
    <polygon points="256,234 275,245 275,267 256,278 237,267 237,245" fill="#ef4444" filter="url(#glow)" />
    <circle cx="256" cy="256" r="8" fill="#f8fafc" />
  </g>

  <!-- Verified Security Badge Dot -->
  <circle cx="410" cy="102" r="18" fill="#22c55e"/>
</svg>
